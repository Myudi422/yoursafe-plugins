name: Update plugin index

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'index.json'
      - 'tools/build_index.py'
      - '.github/workflows/update-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-index-main
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Regenerate and publish catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Work on the latest branch in this disposable runner checkout.
            git fetch origin main
            git reset --hard origin/main
            python3 tools/build_index.py
            if git diff --quiet -- index.json; then
              echo 'Catalog already matches the plugins.'
              exit 0
            fi
            git add -- index.json
            git commit -m 'chore: regenerate plugin index'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Branch changed during generation; retrying ($attempt/3)."
          done
          echo 'Could not publish the catalog after three attempts.' >&2
          exit 1
